name: Router checks
on: [push, pull_request]
jobs:
  docker-graders:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare pinned optional evaluator runtime
        run: python -c "import subprocess; from tests.grader_sandbox import IMAGE; subprocess.run(['docker', 'pull', IMAGE], check=True)"
      - name: Verify sandbox and all evaluator families (real containers)
        env:
          ROUTER_TEST_DOCKER_GRADERS: '1'
        run: python -m unittest discover -s tests -p "test_*.py"
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python tests/evaluate_routing.py
  monitor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile Windows native monitor
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -BuildOnly -FrameworkReferencePath 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
      - name: Run shared WebView2 native self-tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $routerReview = Start-Process -FilePath './dist/codex-monitor-v24.exe' -ArgumentList '--self-test' -PassThru
          if (-not $routerReview.WaitForExit(120000)) {
            $routerReview.Kill()
            throw 'WebView2 self-test timed out'
          }
          Get-Content -LiteralPath './state/ui-review-checks.txt'
          if ($routerReview.ExitCode -ne 0) { throw 'WebView2 self-test failed' }
      - name: Save Windows WebView2 validation artifacts
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-webview2-validation
          path: |
            state/ui-review-checks.txt
            state/review-*.png
          if-no-files-found: warn
      - name: Compile macOS native monitor
        if: runner.os == 'macOS'
        run: xcrun swiftc MonitorMac.swift -o "$RUNNER_TEMP/codex-monitor-mac" -framework AppKit -framework WebKit -framework Security -target "$(uname -m)-apple-macosx12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:layout
        env:
          ROUTER_TEST_BROWSER: chromium
      - name: Build and verify Ubuntu native package UI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-secret-1 gir1.2-ayatanaappindicator3-0.1 desktop-file-utils xvfb dbus-x11
          /usr/bin/python3 build_linux_package.py --output release/linux-ui
          xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/smoke_package_linux.py release/linux-ui/*.deb
  deb-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 desktop-file-utils
      - name: Build initial and upgrade packages
        run: |
          python3 build_linux_package.py --output release/deb-v1 --revision 1
          python3 build_linux_package.py --output release/deb-v2 --revision 2
      - name: Validate install, import, upgrade, remove, purge and reinstall
        run: python3 tests/smoke_deb_lifecycle.py release/deb-v1/*.deb release/deb-v2/*.deb
