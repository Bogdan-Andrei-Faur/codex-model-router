<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Codex · isla dinámica</title><link rel="stylesheet" href="monitor.css"></head>
<body class="compact"><main id="surface" aria-label="Monitor de Codex">
<button id="height-grip" aria-label="Ajustar altura del panel" title="Arrastra para ajustar. Doble clic para altura automática."></button>
<section id="compact"><div id="peek" hidden></div><div class="capsule-bar"><div class="capsule-left"><div class="crew"><div id="agents"></div></div><button id="compact-summary" aria-label="Ver agentes"><strong>Un respiro.</strong><span>Codex</span></button></div><div class="camera-gap" aria-hidden="true"></div><div class="capsule-right"><button id="quota" class="quota" aria-label="Cuota de Codex"></button><div class="divider"><button id="expand" class="icon" aria-label="Desplegar isla" data-icon="chevron-right"></button></div></div></div></section>
<section id="expanded" hidden aria-labelledby="view-title"><h1 id="view-title" class="sr-only">Inicio</h1>
<nav aria-label="Vistas"><div class="nav-left"><button data-tab="home" class="selected" aria-label="Inicio" aria-pressed="true" data-icon="house"></button><button data-tab="activity" aria-label="Agentes" aria-pressed="false" data-icon="users-round"></button></div><div class="nav-right"><button data-tab="history" aria-label="Historial" aria-pressed="false" data-icon="history"></button><button data-tab="statistics" aria-label="Consumo" aria-pressed="false" data-icon="chart-no-axes-combined"></button><button data-tab="settings" aria-label="Ajustes" aria-pressed="false" data-icon="settings"></button></div></nav>
<div id="notices"><div id="connection" class="sr-only" role="status"><i class="pulse"></i><span>Esperando conexión</span></div><span id="feedback" role="status"></span></div>
<div id="pages"><section id="activity" class="page"></section><section id="history" class="page" hidden></section><section id="statistics" class="page" hidden></section><section id="settings" class="page" hidden></section></div>
</section>
</main><script src="icons.js"></script><script src="core.js"></script><script src="characters.js"></script><script src="scenes.js"></script><script src="monitor.js"></script></body></html>
