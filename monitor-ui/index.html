<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Codex automático</title><link rel="stylesheet" href="monitor.css"></head>
<body class="compact"><main id="surface" aria-label="Monitor de Codex">
<button id="height-grip" aria-label="Ajustar altura del panel" title="Arrastra para ajustar. Doble clic para altura automática."></button>
<section id="compact"><div id="peek" hidden></div><div class="capsule-bar"><img class="logo" src="codex.png" alt="Codex automático"><div class="crew"><div id="agents"></div></div><button id="quota" class="quota" aria-label="Cuota de Codex"></button><div class="divider"><button id="expand" class="icon" aria-label="Desplegar panel lateral" data-icon="panel-left-open"></button></div></div></section>
<section id="expanded" hidden><header><div class="header-copy"><div class="eyebrow">CODEX MODEL ROUTER</div><h1 id="view-title">Agentes</h1><div id="connection"><i class="pulse"></i><span>Esperando conexión</span></div></div><button data-tab="settings" class="icon" aria-label="Ajustes" data-icon="sliders-horizontal"></button><button id="collapse" class="icon" aria-label="Volver a vista compacta" data-icon="panel-left-close"></button><button id="hide" class="icon" aria-label="Ocultar monitor" data-icon="x"></button></header>
<nav aria-label="Vistas"><button data-tab="activity" class="selected" aria-pressed="true">Agentes</button><button data-tab="history" aria-pressed="false">Historial</button><button data-tab="statistics" aria-pressed="false">Consumo</button></nav>
<div id="pages"><section id="activity" class="page"></section><section id="history" class="page" hidden></section><section id="statistics" class="page" hidden></section><section id="settings" class="page" hidden></section></div>
<footer><button id="pause">Pausar selección</button><span id="feedback" role="status"></span><span id="product-version" title="Versión de Codex automático">v—</span></footer></section>
</main><script src="icons.js"></script><script src="core.js"></script><script src="monitor.js"></script></body></html>
